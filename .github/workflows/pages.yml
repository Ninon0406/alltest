name: Publish REBORN to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[site-build]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/verify-character-composition.mjs
      - run: npm run test:e2e
      - run: npm run content
      - name: Refresh static files for main branch Pages compatibility
        run: |
          node scripts/stage-site.mjs
          node scripts/verify-interior-assets.mjs .
          node scripts/verify-equipment-assets.mjs .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets art .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Refresh compiled Pages site [site-build]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify live CSS and gameplay
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4; do
            node scripts/verify-production.mjs "$SITE_URL" && node scripts/verify-progression.mjs "$SITE_URL" && node scripts/verify-one-life.mjs "$SITE_URL" && node scripts/verify-equipment.mjs "$SITE_URL" && node scripts/verify-power.mjs "$SITE_URL" && exit 0
            sleep 15
          done
          exit 1
