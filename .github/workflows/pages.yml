name: GODSEED checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godseed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: GODSEED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: GODSEED/package-lock.json
      - run: npm ci
      - run: npm run test:all
      - run: node scripts/stage-site.mjs
      - run: npm run validate:references
      - name: Install Thai font
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends fonts-tlwg-loma-otf
      - name: Install Chromium headless shell
        timeout-minutes: 5
        run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godseed-browser-evidence
          path: GODSEED/test-results
      - uses: actions/upload-pages-artifact@v3
        with:
          path: GODSEED/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
