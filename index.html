const ttl=k=>"แคลคูลัส 1 บท "+C[k][0]+" "+C[k][1];
const srch=k=>"https://www.youtube.com/results?search_query="+encodeURIComponent("Algoritmatics "+ttl(k));
const clipRow=k=>`<div class="clip"><b>บท ${C[k][0]}</b> ${C[k][1]} <span class="mut">(${C[k][2]} นาที)</span><br><a href="${srch(k)}" target="_blank" rel="noopener">▶ ค้นหาคลิปนี้บน YouTube</a> · <button data-c="${k}">คัดลอกชื่อ</button></div>`;
function clips(b){
 const n=NOTE[b.id]?`<div class="mut">${NOTE[b.id]}</div>`:"";
 return `<h4>คลิปสอนที่ตรงหัวข้อ (ดูตามลำดับ)</h4>${b.cl.map(clipRow).join("")}${n}<div class="mut">หรือเปิด <a href="${PL}" target="_blank" rel="noopener">เพลย์ลิสต์</a> แล้วกดแว่นขยายมุมขวาบน วางชื่อที่คัดลอกไว้</div>`}
function allClips(){
 const use={};S.forEach((s,i)=>s.subs.forEach(b=>b.cl.forEach(k=>{(use[k]=use[k]||[]).push(`${b.id} (${b.ws})`)})));
 return `<div class="card"><h2>รวมคลิปทั้งหมด (เรียงตามเพลย์ลิสต์)</h2><p class="mut">บอกว่าแต่ละคลิปช่วยทำหัวข้อไหน/ใบงานข้อไหน</p></div>`+Object.keys(C).map(k=>`<div class="card">${clipRow(k)}<div class="mut">${use[k]?"ช่วยทำ: "+use[k].join(" · "):"ไม่อยู่ในแนวข้อสอบ"}</div></div>`).join("")}
function page(i){
 if(i==9)return allClips();
 if(i==8){return `<div class="card"><h2>หน้า 9 · ซ้อมสอบ (โจทย์ใหม่ 10 ข้อ)</h2><p class="mut">ลองทำก่อนแล้วค่อยกดดูเฉลย</p></div>`+PR.map((p,k)=>`<div class="card"><b>ข้อ ${k+1}.</b> ${p[0]}<details><summary>ดูเฉลย</summary><div class="ex">${p[1]}</div></details></div>`).join("")}
 const s=S[i];
 return `<div class="card"><h2>หน้า ${i+1} · ${s.t}</h2><span class="tag">${s.ws}</span> <span class="st">${st(s.st)}</span> <span class="mut">ความยากรวม</span>
 <div class="cols"><div><h4>สูตรที่ต้องรู้/ใช้บ่อย</h4>${L(s.know)}</div><div><h4>สูตรที่ไม่ให้ในข้อสอบ (ต้องจำ)</h4>${L(s.memo)}</div></div>
 <details><summary>สูตรที่ให้ในข้อสอบ</summary><div class="mut">อนุพันธ์</div>${L(GIVEN_D)}<div class="mut">อินทิกรัล</div>${L(GIVEN_I)}</details></div>`+
 s.subs.map(b=>`<div class="card"><h3>${b.id} ${b.t}</h3><span class="st">${st(b.st)}</span> <span class="tag">${b.ws}</span>
 ${clips(b)}<h4>คำตอบที่ต้องการ / วิธีตอบ</h4><div>${b.ans}</div><h4>วิธีทำ</h4><ol>${b.steps.map(x=>"<li>"+x+"</li>").join("")}</ol>
 <div class="tip"><b>เคล็ดลับ/เฉลยข้อในใบงาน:</b> ${b.tip}</div><div class="ex"><b>ตัวอย่าง:</b> ${b.ex[0]}<br>${b.ex[1]}</div>
 <h4>ลองทำ</h4><div>${b.ws}</div></div>`).join("")}
const nav=document.getElementById("nav"),app=document.getElementById("app");
const names=[...S.map((s,i)=>"หน้า "+(i+1)),"หน้า 9 ซ้อมสอบ","รวมคลิป"];
function go(i){nav.innerHTML=names.map((n,k)=>`<button class="${k==i?"on":""}" data-k="${k}">${n}</button>`).join("");app.innerHTML=page(i);window.scrollTo(0,0);try{history.replaceState(null,"","#"+i)}catch(e){}}
nav.onclick=e=>{const k=e.target.dataset.k;if(k!==undefined)go(+k)};
app.onclick=e=>{const k=e.target.dataset.c;if(!k)return;const t=ttl(k),b=e.target;
 try{navigator.clipboard.writeText(t).then(()=>{b.textContent="คัดลอกแล้ว ✓"},()=>{prompt("คัดลอกชื่อคลิป",t)})}catch(x){prompt("คัดลอกชื่อคลิป",t)}};
go(Math.min(9,Math.max(0,parseInt(location.hash.slice(1))||0)));
</script></body></html>
