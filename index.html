ัวอย่างแต่งเพื่อสอน"}],"tip":"จำว่า “ดิฟหน้า-หลังเดิม + หน้าเดิม-ดิฟหลัง”","pitfall":"$(uv)\\prime$ ไม่ใช่ $u\\prime v\\prime$","practice":[],"videoNote":""},{"id":"p1-quotient","title":"อนุพันธ์ของผลหาร","level":3,"clips":[48,49],"goal":"ตอบ $dy/dx$ พร้อมระบุจุดที่ตัวส่วนเป็นศูนย์ว่าไม่อยู่ในโดเมน","spot":"เห็นฟังก์ชันหารกันและตัดรูปไม่ได้ง่าย ให้ใช้ $u$ = ตัวเศษ และ $v$ = ตัวส่วน","given":[],"memory":["$\\left(\\frac uv\\right)\\prime=\\frac{u\\prime v-uv\\prime}{v^2},\\ v\\ne0$"],"steps":["ตั้งตัวเศษและตัวส่วนให้ชัด","หาอนุพันธ์ของตัวเศษและตัวส่วนแยกกัน","ใช้ “ล่างดิฟบน ลบบนดิฟล่าง ส่วนล่างยกกำลังสอง”","ใส่วงเล็บรอบทุกก้อน โดยเฉพาะพจน์ที่ถูกลบ"],"examples":[{"q":"$y=(x^2+1)/(x-1)$","steps":["$u\\prime=2x,\\ v\\prime=1$","$y\\prime=[2x(x-1)-(x^2+1)]/(x-1)^2$"],"answer":"$y\\prime=(x^2-2x-1)/(x-1)^2,\\ x\\ne1$","source":"ตัวอย่างแต่งเพื่อสอน"},{"q":"$y=\\dfrac{(4x-3)(x^2-8x+2)}{x-2}$","steps":["ตั้ง $N=(4x-3)(x^2-8x+2)$ แล้วใช้กฎผลคูณได้ $N\\prime=4(x^2-8x+2)+(4x-3)(2x-8)$","แทนในกฎผลหาร $y\\prime=[N\\prime(x-2)-N]/(x-2)^2$"],"answer":"$\\displaystyle y\\prime=\\frac{[4(x^2-8x+2)+(4x-3)(2x-8)](x-2)-(4x-3)(x^2-8x+2)}{(x-2)^2},\\ x\\ne2$","source":"โจทย์ตัวอย่างในแนวข้อสอบ ส่วนที่ 1"}],"tip":"โจทย์ซ้อนผลคูณกับผลหาร ให้หาตัวเศษเป็นงานย่อยก่อนแล้วค่อยใช้ผลหาร","pitfall":"สลับลำดับการลบแล้วเครื่องหมายจะผิดทั้งคำตอบ","practice":[],"videoNote":""},{"id":"p1-chain","title":"ฟังก์ชันประกอบและกฎลูกโซ่","level":3,"clips":[50,51],"goal":"ตอบอนุพันธ์ที่คูณอนุพันธ์ของฟังก์ชันชั้นในครบทุกชั้น","spot":"เห็นวงเล็บทั้งก้อนยกกำลัง ให้มองก้อนในเป็น $u$ และเลขชี้กำลังเป็น $n$","given":[],"memory":["$\\frac{dy}{dx}=\\frac{dy}{du}\\frac{du}{dx}$","$(u^n)\\prime=nu^{n-1}u\\prime$"],"steps":["กำหนด $u$ เป็นสิ่งที่อยู่ในวงเล็บ","ดิฟฟังก์ชันชั้นนอก โดยยังเก็บก้อนในไว้","คูณอนุพันธ์ของก้อนใน","ถ้ามีหลายชั้นให้ทำจากนอกเข้าในจนครบ"],"examples":[{"q":"$f(x)=(4x^3+9x-1)^7$","steps":["$u=4x^3+9x-1,\\ n=7,\\ u\\prime=12x^2+9$","ชั้นนอกดิฟได้ $7u^6$ แล้วคูณ $u\\prime$"],"answer":"$f\\prime(x)=7(4x^3+9x-1)^6(12x^2+9)$","source":"โจทย์ตัวอย่างในแนวข้อสอบ ส่วนที่ 1"}],"tip":"พูดในใจ “เจ็ดลงหน้า ลดเป็นหก คูณดิฟข้างใน”","pitfall":"ห้ามลืมตัวคูณอนุพันธ์ข้างใน แม้เป็นเพียงค่าคงที่","practice":[],"videoNote":""},{"id":"p1-trig","title":"อนุพันธ์ของตรีโกณมิติ","level":3,"clips":[52,53],"goal":"ตอบอนุพันธ์และใช้มุมหน่วยเรเดียน","spot":"เห็น $\\sin u,\\cos u,\\tan u,\\sec u,\\cot u,\\csc u$ ให้ใช้สูตรในใบสูตร แล้วคูณ $u\\prime$","given":["$(\\sin u)\\prime=\\cos u\\,u\\prime$; $(\\cos u)\\prime=-\\sin u\\,u\\prime$","$(\\tan u)\\prime=\\sec^2u\\,u\\prime$; $(\\sec u)\\prime=\\sec u\\tan u\\,u\\prime$","$(\\cot u)\\prime=-\\csc^2u\\,u\\prime$; $(\\csc u)\\prime=-\\csc u\\cot u\\,u\\prime$"],"memory":["ผลคูณ/ผลหารยังต้องใช้เมื่อมีหลายฟังก์ชัน และต้องแยก $\\sin^2x=(\\sin x)^2$ จาก $\\sin(x^2)$"],"steps":["ระบุว่าฟังก์ชันนอกคืออะไรและข้างในคืออะไร","เลือกสูตรตรีโกณมิติให้ตรง","คูณอนุพันธ์ของข้างใน และตรวจเครื่องหมายลบ"],"examples":[{"q":"$y=\\sin(x^2)$","steps":["ข้างนอกคือ $\\sin u$; ข้างใน $u=x^2$","$u\\prime=2x$ จึงคูณ $2x$"],"answer":"$y\\prime=2x\\cos(x^2)$","source":"ตัวอย่างแต่งเพื่อสอน"},{"q":"$y=\\sin^2x$","steps":["ข้างนอกคือ $u^2$; ข้างใน $u=\\sin x$","$y\\prime=2\\sin x\\cdot\\cos x$"],"answer":"$y\\prime=2\\sin x\\cos x$","source":"ตัวอย่างแต่งเพื่อสอน"}],"tip":"cos, cot, csc เป็นสามสูตรที่มีเครื่องหมายลบ","pitfall":"ตำแหน่งยกกำลังเปลี่ยนกฎลูกโซ่ จึงอ่านวงเล็บก่อนเสมอ","practice":[],"videoNote":""},{"id":"p1-inverse","title":"อนุพันธ์ของตรีโกณมิติผกผัน","level":3,"clips":[54,55],"goal":"ตอบอนุพันธ์ของฟังก์ชันผกผัน พร้อมเงื่อนไขที่สูตรใช้ได้","spot":"$\\arcsin u$ หรือ $\\sin^{-1}u$ ในความหมายฟังก์ชันผกผัน ไม่ใช่ $1/\\sin u$","given":["$(\\arcsin u)\\prime=\\frac{u\\prime}{\\sqrt{1-u^2}}$; $(\\arccos u)\\prime=-\\frac{u\\prime}{\\sqrt{1-u^2}}$, $|u|\u003c1$","$(\\arctan u)\\prime=\\frac{u\\prime}{1+u^2}$; $(\\operatorname{arccot}u)\\prime=-\\frac{u\\prime}{1+u^2}$","$(\\operatorname{arcsec}u)\\prime=\\frac{u\\prime}{|u|\\sqrt{u^2-1}}$; $(\\operatorname{arccsc}u)\\prime=-\\frac{u\\prime}{|u|\\sqrt{u^2-1}}$, $|u|>1$"],"memory":["จำความต่างระหว่างฟังก์ชันผกผันกับส่วนกลับ และคงเครื่องหมายค่าสัมบูรณ์ไว้"],"steps":["ระบุฟังก์ชันผกผันและก้อนใน","อ่านสูตรจากใบสูตรแล้วแทนก้อนในทั้งก้อน","คูณอนุพันธ์ก้อนในและระบุโดเมนที่อนุพันธ์มีค่า"],"examples":[{"q":"$y=\\arctan(3x)$","steps":["$u=3x,\\ u\\prime=3$","ตัวส่วนคือ $1+(3x)^2$"],"answer":"$y\\prime=3/(1+9x^2)$","source":"ตัวอย่างแต่งเพื่อสอน"},{"q":"$y=\\arcsin(2x)$","steps":["$u=2x,\\ u\\prime=2$","ใช้สูตรส่วนราก $\\sqrt{1-u^2}$"],"answer":"$y\\prime=2/\\sqrt{1-4x^2},\\ |x|\u003c1/2$","source":"ตัวอย่างแต่งเพื่อสอน"}],"tip":"arctan ใช้ 1 บวกกำลังสอง ส่วน arcsin ใช้รากของ 1 ลบกำลังสอง","pitfall":"อย่าตัดค่าสัมบูรณ์ในสูตร arcsec/arccsc โดยไม่รู้เครื่องหมายของก้อนใน","practice":[],"videoNote":""}]},{"n":2,"title":"เลขชี้กำลังและลอการิทึม","subtitle":"ฐานเปลี่ยน หรือเลขชี้กำลังเปลี่ยน?","part":2,"worksheet":8,"level":3,"goal":"หาอนุพันธ์ของฟังก์ชันเลขชี้กำลัง ลอการิทึม และฟังก์ชันที่ทั้งฐานและชี้กำลังเป็นตัวแปร","formula":"(\\ln|u|)\\prime=\\frac{u\\prime}{u}","topics":[{"id":"p2-exp","title":"อนุพันธ์ของฟังก์ชันเลขชี้กำลัง","level":2,"clips":[56,57,58],"goal":"ตอบ $y\\prime$ โดยคงฟังก์ชันเลขชี้กำลังไว้ และคูณอนุพันธ์ชี้กำลัง","spot":"$a^u$ มีฐาน $a$ คงที่ ส่วนเลขชี้กำลังเปลี่ยน ต่างจาก $u^n$ ที่เลขชี้กำลังคงที่","given":["$(e^u)\\prime=e^u u\\prime$","$(a^u)\\prime=a^u\\ln a\\,u\\prime$, $a>0$"],"memory":["แยกให้ออกว่าเป็นกำลังของฟังก์ชันหรือเป็นฟังก์ชันเลขชี้กำลัง"],"steps":["ระบุฐานและเลขชี้กำลัง","ถ้าฐานเป็น e คง e ยกกำลังเดิม; ถ้าเป็นฐาน a คูณ ln a เพิ่ม","คูณอนุพันธ์ของเลขชี้กำลัง"],"examples":[{"q":"$y=e^{x^2}+2^{3x}$","steps":["พจน์แรก: $e^{x^2}(2x)$","พจน์ที่สอง: $2^{3x}\\ln2(3)$"],"answer":"$y\\prime=2xe^{x^2}+3(\\ln2)2^{3x}$","source":"ตัวอย่างแต่งเพื่อสอน"}],"tip":"ฐาน e ไม่มี ln เพิ่ม เพราะ ln e = 1","pitfall":"อย่าใช้ $nx^{n-1}$ กับ $2^x$","practice":[],"videoNote":""},{"id":"p2-log","title":"อนุพันธ์ของลอการิทึม","level":2,"clips":[56,57,58],"goal":"ตอบอนุพันธ์ในรูปเศษส่วน และตรวจโดเมนของฟังก์ชันเดิม","spot":"$\\ln u$ ต้องมี $u>0$ แต่ $\\ln|u|$ ใช้ได้เมื่อ $u\\ne0$","given":["$(\\ln|u|)\\prime=u\\prime/u$","$(\\log_a|u|)\\prime=u\\prime/(u\\ln a)$, $a>0,\\ a\\ne1$"],"memory":["กฎลอการิทึม $\\ln(ab)=\\ln a+\\ln b$ เมื่อ $a,b>0$; ไม่มีสูตรแยก $\\ln(a+b)$"],"steps":["ให้ก้อนในเป็น u","ดิฟก้อนในไว้บน ก้อนเดิมไว้ล่าง","ถ้าไม่ใช่ฐาน e ให้มี ln ของฐานที่ตัวส่วนด้วย"],"examples":[{"q":"$y=\\ln(x^2+1)$","steps":["$u=x^2+1>0$ ทุก x","$u\\prime=2x$"],"answer":"$y\\prime=2x/(x^2+1)$","source":"ตัวอย่างแต่งเพื่อสอน"},{"q":"$y=\\log_3(2x-1)$","steps":["$u\\prime=2$","ฟังก์ชันเดิมต้องมี $2x-1>0$"],"answer":"$y\\prime=2/[(2x-1)\\ln3],\\ x>1/2$","source":"ตัวอย่างแต่งเพื่อสอน"}],"tip":"จำ “ดิฟใน หารของเดิม” สำหรับ ln","pitfall":"ห้ามลืม ln a สำหรับฐานที่ไม่ใช่ e","practice":[],"videoNote":""},{"id":"p2-logdiff","title":"การหาอนุพันธ์โดยใช้ลอการิทึม","level":4,"clips":[59],"goal":"ตอบ $y\\prime$ โดยแทน y เดิมกลับในบรรทัดสุดท้าย","spot":"ทั้งฐานและเลขชี้กำลังมีตัวแปร เช่น $x^x$ หรือมีผลคูณหลายก้อนยกกำลัง เหมาะกับการใส่ ln","given":["$(\\ln|y|)\\prime=y\\prime/y$"],"memory":["$\\ln(u^v)=v\\ln u$ เมื่อ $u>0$","$y=u^v\\Rightarrow y\\prime=u^v[v\\prime\\ln u+v(u\\prime/u)]$"],"steps":["ตรวจว่าฐานเป็นบวกในช่วงที่พิจารณา","ใส่ ln ทั้งสองข้างเพื่อดึงเลขชี้กำลังลงมา","ดิฟทั้งสองข้าง ใช้ผลคูณถ้าเลขชี้กำลังเป็นตัวแปร","คูณ y ทั้งสองข้างแล้วแทน y เดิมกลับ"],"examples":[{"q":"$y=x^x,\\ x>0$","steps":["$\\ln y=x\\ln x$","$y\\prime/y=\\ln x+x(1/x)=\\ln x+1$","คูณ $y=x^x$ กลับ"],"answer":"$y\\prime=x^x(\\ln x+1)$","source":"โจทย์ตัวอย่างในแนวข้อสอบ ส่วนที่ 2"},{"q":"$y=(x^2+1)^x$","steps":["$\\ln y=x\\ln(x^2+1)$","$y\\prime/y=\\ln(x^2+1)+2x^2/(x^2+1)$"],"answer":"$y\\prime=(x^2+1)^x[\\ln(x^2+1)+2x^2/(x^2+1)]$","source":"ตัวอย่างแต่งเพื่อสอน"}],"tip":"ln ช่วยย้ายเลขชี้กำลังลงมา แต่ตอนจบต้องเอา y กลับ","pitfall":"ห้ามดิฟ $x^x$ เป็น $x\\cdot x^{x-1}$ เพราะเลขชี้กำลังไม่คงที่","practice":[],"videoNote":""}]},{"n":3,"title":"อนุพันธ์โดยปริยายและอันดับสูง","subtitle":"ทุกครั้งที่ดิฟ y ต้องมองว่า y ขึ้นกับ x","part":3,"worksheet":9,"level":4,"goal":"ตอบ $dy/dx$ หรือ $d^ny/dx^n$ ตามอันดับที่โจทย์ขอ ถ้ากำหนดจุด ต้องแทนทั้ง x และ y หลังดิฟแล้ว","formula":"\\frac{d}{dx}(y^n)=ny^{n-1}y\\prime","topics":[{"id":"p3-implicit","title":"หาอนุพันธ์โดยปริยาย","level":3,"clips":[60],"goal":"แยก $y\\prime$ ไว้ข้างเดียว คำตอบมี x และ y ได้","spot":"x กับ y อยู่ปนกันและยังไม่ได้แก้ y เป็นฟังก์ชันของ x เช่น $x^2+xy+y^2=7$","given":["สูตรอนุพันธ์พื้นฐานของตรีโกณมิติ/เลขชี้กำลังเมื่อมีในสมการ"],"memory":["$\\frac{d}{dx}(xy)=y+xy\\prime$","$\\frac{d}{dx}(y^n)=ny^{n-1}y\\prime$"],"steps":["ดิฟทั้งสองข้างเทียบ x","พจน์ที่มี y ต้องคูณ y′ ตามลูกโซ่; พจน์ xy ใช้ผลคูณ","ย้ายพจน์ที่มี y′ ไว้ฝั่งเดียว","ดึง y′ เป็นตัวร่วม แล้วหารสัมประสิทธิ์ของมัน"],"examples":[{"q":"$x^2+xy+y^2=7$","steps":["$2x+y+xy\\prime+2yy\\prime=0$","$(x+2y)y\\prime=-(2x+y)$"],"answer":"$y\\prime=-(2x+y)/(x+2y)$ เมื่อ $x+2y\\ne0$","source":"ใบงาน 9 หน้า 1 ข้อ 1(2)"},{"q":"$x\\sin y+y\\cos x=2$","steps":["$\\sin y+x\\cos y\\,y\\prime+y\\prime\\cos x-y\\sin x=0$","$(x\\cos y+\\cos x)y\\prime=y\\sin x-\\sin y$"],"answer":"$y\\prime=(y\\sin x-\\sin y)/(x\\cos y+\\cos x)$ เมื่อส่วนไม่เป็นศูนย์","source":"ใบงาน 9 หน้า 1 ข้อ 1(3)"}],"tip":"ล้อมทุกพจน์ที่มี y′ แล้วค่อยย้ายข้าง จะเก็บพจน์ได้ครบ","pitfall":"อย่าแทน y เป็นค่าคงที่ก่อนดิฟ","practice":[{"page":1,"q":"1(1)–1(3)","detail":"อนุพันธ์โดยปริยาย เริ่มวงกลม แล้วเพิ่ม xy และตรีโกณมิติ"}],"videoNote":""},{"id":"p3-point","title":"อนุพันธ์โดยปริยาย ณ จุด","level":3,"clips":[60],"goal":"ตอบค่าตัวเลขของ $dy/dx$ ที่จุดกำหนด ไม่ค้างเป็นสมการทั่วไป","spot":"โจทย์ระบุ “ที่จุด (a,b)” ให้ตรวจว่าจุดนั้นอยู่บนสมการ แล้วดิฟก่อนแทนค่า","given":["$(e^u)\\prime=e^u u\\prime$; $(\\tan u)\\prime=\\sec^2u\\,u\\prime$"],"memory":["ค่าที่กำหนด ณ ขณะหนึ่งไม่ทำให้ตัวแปรนั้นเป็นค่าคงที่ตลอด"],"steps":["ตรวจจุดกับสมการเดิม","ดิฟสมการโดยเก็บ x,y เป็นตัวแปร","แทนจุดและแก้ y′; ใช้ค่าตรีโกณมิติที่แน่นอน"],"examples":[{"q":"$x\\tan y+y\\sec x=\\pi/4$ ที่ $(0,\\pi/4)$","steps":["$\\tan y+x\\sec^2y\\,y\\prime+y\\prime\\sec x+y\\sec x\\tan x=0$","แทนจุดได้ $1+0+y\\prime+0=0$"],"answer":"$y\\prime(0)=-1$","source":"ใบงาน 9 หน้า 2 ข้อ 2"},{"q":"$x^2y+e^{x+y}+\\tan y=1$ ที่ $(0,0)$","steps":["$2xy+x^2y\\prime+e^{x+y}(1+y\\prime)+\\sec^2y\\,y\\prime=0$","แทนได้ $1+2y\\prime=0$"],"answer":"$y\\prime(0)=-1/2$","source":"ใบงาน 9 หน้า 2 ข้อ 3"}],"tip":"ถ้าต้องการค่า ณ จุดอย่างเดียว แทนหลังดิฟรอบนั้นได้ทันทีเมื่อไม่ต้องดิฟต่อ","pitfall":"ดิฟ e^(x+y) ต้องคูณ (1+y′) ไม่ใช่แค่ y′","practice":[{"page":2,"q":"2–3","detail":"หาความชัน ณ จุดที่กำหนด"}],"videoNote":""},{"id":"p3-higher","title":"อนุพันธ์อันดับสูงของฟังก์ชันชัดแจ้ง","level":3,"clips":[61],"goal":"ตอบตรงอันดับ เช่น $y\\prime\\prime\\prime$ = อันดับ 3 และ $y^{(4)}$ = อันดับ 4","spot":"หาอนุพันธ์ซ้ำทีละรอบ ไม่ใช่ยกกำลังอนุพันธ์","given":["สูตร e และตรีโกณมิติที่ใช้ซ้ำในแต่ละรอบ"],"memory":["$y^{(n)}=\\frac{d}{dx}y^{(n-1)}$; ต้องใช้กฎผลคูณใหม่ในแต่ละรอบ"],"steps":["จดบรรทัด y′, y″, y‴ แยกกัน","จัดรูปหรือดึงตัวร่วมหลังแต่ละรอบเพื่อลดงาน","นับอันดับให้ครบตามที่โจทย์ขอ"],"examples":[{"q":"$y=2x^5-3x^4+4x^2-7x+1$ หา $y\\prime\\prime\\prime$","steps":["$y\\prime=10x^4-12x^3+8x-7$","$y\\prime\\prime=40x^3-36x^2+8$","$y\\prime\\prime\\prime=120x^2-72x$"],"answer":"$y\\prime\\prime\\prime=120x^2-72x$","source":"ใบงาน 9 หน้า 3 ข้อ 4(1)"},{"q":"$y=x^2e^x$ หา $y\\prime\\prime\\prime$","steps":["$y\\prime=e^x(x^2+2x)$","$y\\prime\\prime=e^x(x^2+4x+2)$","$y\\prime\\prime\\prime=e^x(x^2+6x+6)$"],"answer":"$y\\prime\\prime\\prime=e^x(x^2+6x+6)$","source":"ใบงาน 9 หน้า 3 ข้อ 4(2)"}],"tip":"สำหรับ e^x คูณพหุนาม ทุกครั้งจะได้ e^x คูณ (พหุนามเดิม + ดิฟพหุนาม)","pitfall":"y^(4) ไม่ใช่ (y′)^4","practice":[{"page":3,"q":"4(1)–4(3)","detail":"ข้อ 4(3) ขออันดับ 4 ของ $e^{2x}\\cos x$ ไม่ใช่อันดับ 3"}],"videoNote":""},{"id":"p3-higher-implicit","title":"อนุพันธ์อันดับสูงโดยปริยาย","level":4,"clips":[60,61],"goal":"ตอบอนุพันธ์อันดับที่ขอ ณ จุด พร้อมแสดงค่าระหว่างทางที่ใช้","spot":"ต้องดิฟซ้ำสมการที่มี y′ จึงมีทั้ง (y′)^2 และ y″ เกิดขึ้น","given":[],"memory":["$(yy\\prime)\\prime=(y\\prime)^2+yy\\prime\\prime$","$((y\\prime)^2)\\prime=2y\\prime y\\prime\\prime$"],"steps":["ดิฟสมการเดิมหนึ่งรอบ","ดิฟสมการอนุพันธ์ต่อก่อนแทนค่าคงที่ลงในนิพจน์ที่จะนำไปดิฟ","เมื่อได้ความสัมพันธ์ของอันดับที่ต้องการแล้ว ค่อยแทนจุดและอนุพันธ์อันดับต่ำที่คำนวณไว้"],"examples":[{"q":"$x^2+y^2=2x$ หา $d^3y/dx^3$ ที่ $(1,1)$","steps":["รอบ 1: $2x+2yy\\prime=2$ จึงได้ $y\\prime=0$ ที่จุดนี้","รอบ 2: $2+2(y\\prime)^2+2yy\\prime\\prime=0$ จึงได้ $y\\prime\\prime=-1$","รอบ 3: $6y\\prime y\\prime\\prime+2yy\\prime\\prime\\prime=0$","แทนค่า $0+2(1)y\\prime\\prime\\prime=0$"],"answer":"$\\left.d^3y/dx^3\\right|_{(1,1)}=0$","source":"ใบงาน 9 หน้า 4 ข้อ 5"}],"tip":"คำนวณค่า y′ และ y″ ณ จุดไว้ข้างกระดาษ แต่ยังเก็บสมการทั่วไปสำหรับดิฟรอบต่อไป","pitfall":"ห้ามสรุปว่า y′ ณ จุด = 0 แล้วดิฟค่าศูนย์เพื่อหา y″","practice":[{"page":4,"q":"5","detail":"อันดับ 3 โดยปริยาย ณ (1,1)"}],"videoNote":""}]},{"n":4,"title":"ผลต่างอนุพัทธ์และการประมาณค่า","subtitle":"ดิฟเพื่อประมาณค่าที่อยู่ใกล้ค่าที่คิดง่าย","part":4,"worksheet":10,"level":3,"goal":"ถ้าถาม dy ให้ตอบนิพจน์ที่มี dx; ถ้าถามค่าประมาณให้ตอบจำนวนพร้อมสัญลักษณ์ ≈ และแสดงจุดที่ใช้ประมาณ","formula":"f(a+\\Delta x)\\approx f(a)+f\\prime(a)\\Delta x","topics":[{"id":"p4-differential","title":"หาผลต่างอนุพัทธ์ dx และ dy","level":2,"clips":[62],"goal":"ตอบ $dy=f\\prime(x)dx$ หรือค่าของ dy เมื่อกำหนด x และ dx","spot":"โจทย์ใช้คำว่า “ผลต่างอนุพัทธ์” หรือให้ dx มา อย่าหยุดที่การหาอนุพันธ์อย่างเดียว","given":[],"memory":["$dx=\\Delta x$; $dy=f\\prime(x)dx$","$\\Delta y=f(x+\\Delta x)-f(x)$; โดยทั่วไป $dy\\ne\\Delta y$"],"steps":["หา f′(x) ตามกฎอนุพันธ์","คูณ dx เพื่อเปลี่ยนอนุพันธ์ให้เป็นผลต่างอนุพัทธ์","ถ้ามี x และ dx ให้แทนค่าท้ายสุด","แยกค่าประมาณ dy ออกจากผลต่างจริง Δy"],"examples":[{"q":"$y=x^3$ ที่ $x=2,\\ dx=0.01$ จงหา dy","steps":["$dy=3x^2dx$","$dy=3(2)^2(0.01)=0.12$","ผลต่างจริง $\\Delta y=2.01^3-2^3=0.120601$"],"answer":"$dy=0.12$ ซึ่งเป็นค่าประมาณของ $\\Delta y$","source":"ตั
